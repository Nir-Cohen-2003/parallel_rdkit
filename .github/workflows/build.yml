name: Build and Publish

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    release:
        types: [created]
    workflow_dispatch:

jobs:
    build-and-publish:
        name: Build and Publish on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest]
        permissions:
            id-token: write
            contents: read

        steps:
            - uses: actions/checkout@v4

            - name: Install Pixi (Linux)
              if: runner.os == 'Linux'
              run: |
                  curl -fsSL https://pixi.sh/install.sh | sh
                  echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
              shell: bash

            - name: Install Pixi (Windows)
              if: runner.os == 'Windows'
              run: |
                  powershell -ExecutionPolicy Bypass -c "irm -useb https://pixi.sh/install.ps1 | iex"
                  Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.pixi\bin"
              shell: powershell

            - name: Build packages
              run: |
                  pixi publish
              shell: bash

            - name: Run tests
              run: |
                  pixi run -e test test
              shell: bash

            - name: Upload wheel artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: dist-${{ matrix.os }}
                  path: dist/*.whl

            - name: Upload conda artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: conda-dist-${{ matrix.os }}
                  path: "*.conda"

            - name: Publish to prefix.dev
              if: github.event_name == 'release'
              run: |
                  for package in *.conda; do
                    pixi upload prefix --skip-existing --channel nir-cohen "$package" || true
                  done
              shell: bash
