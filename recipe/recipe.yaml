context:
  name: "parallel_rdkit"
  version: "0.5.0"

package:
  name: "${{ name|lower }}"
  version: "${{ version }}"

source:
  path: ../src
  use_gitignore: true
  filter:
    exclude:
      - ../tests/**
      - ../docs/**
      - ../data/**
      - ../benchmarks/**

build:
  number: 0

requirements:
  ignore_run_exports:
    by_name:
      - python_abi
  build:
    - ${{ compiler('cxx') }}
    - python ${{ python }}.*
    - pip
    - python-build
    - librdkit-dev
    - rdkit
    - nanobind
    - libboost-devel == 1.86
    - scikit-build-core
    - cmake
    - ninja
  host:
    - python ${{ python }}.*
    - pip
    - python-build
    - librdkit-dev
    - rdkit
    - nanobind
    - libboost-devel == 1.86
    - scikit-build-core
    - cmake
    - ninja
  run:
    - python ${{ python }}.*
    - numpy
    - polars
    - pyarrow
    - selfies
    - ${{ pin_compatible('rdkit') }}

tests:
  - python:
      imports:
        - parallel_rdkit

about:
  summary: "A parallel RDKit utilities implementation"
  license: Apache-2.0
